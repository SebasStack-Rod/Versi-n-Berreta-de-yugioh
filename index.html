<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b1a">
<title>Duel Simple</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <div class="top">
    <div class="hud" id="hudT"><b class="nm"></b><div class="lpb"><i></i><span></span></div><div class="oh"></div></div>
    <div class="tools"><button id="logBtn">📜</button><button id="muteBtn">🔊</button><button id="restartBtn" title="Menú">☰</button></div>
  </div>
  <div class="mid">
    <div id="bw"><main id="board"></main><div id="hint" hidden></div></div>
    <div class="hud" id="hudB"><b class="nm"></b><div class="lpb"><i></i><span></span></div></div>
    <div id="acts"></div>
  </div>
  <div id="hand"></div>
</div>
<div id="stage" hidden><div id="chips"></div><button id="nextBtn"></button><button id="endBtn">Fin de turno</button></div>
<div id="menu" class="scr">
  <h1 class="nt">DUEL SIMPLE</h1>
  <div class="mb"><button class="nb" id="bPlay">⚔ Duelo local</button><button class="nb" id="bCont" hidden>▶ Continuar partida</button><button class="nb" id="bLib">📚 Biblioteca de mazos</button><button class="nb" id="bD1">🂠 Mazo del Jugador 1</button><button class="nb" id="bD2">🂠 Mazo del Jugador 2</button><button class="nb" id="bHost">🌐 Crear sala online</button><button class="nb" id="bJoin">🔗 Unirme a sala</button></div>
  <p id="mi"></p>
</div>
<div id="builder" class="scr" hidden>
  <div class="bh"><b id="bT"></b><span id="bC"></span><span class="sp"></span><button class="nb" id="bRnd">Aleatorio</button><button class="nb" id="bClr">Vaciar</button><button class="nb" id="bNo">Cancelar</button><button class="nb ok" id="bOk">Guardar</button></div>
  <div class="bh" id="bh2"><span id="bN" class="bnm"></span><button class="nb" id="bLoad">📚 Cargar mazo</button><button class="nb" id="bSave">💾 Guardar como…</button></div>
  <div id="dk" class="cg"></div>
  <div class="bs"><input id="q" type="search" placeholder="Buscar carta…" autocomplete="off"><select id="flt"><option value="">Todas</option><option value="m">Monstruos</option><option value="s">Magias</option><option value="p">Trampas</option><option value="f">Fusión</option></select></div>
  <div id="col" class="cg"></div>
</div>
<div id="lib" class="scr" hidden>
  <div class="bh"><button class="nb" id="lBack">← Volver</button><b>Biblioteca de mazos</b><span class="sp"></span><span id="lC"></span></div>
  <div class="bs"><input id="lq" type="search" placeholder="Buscar mazo, personaje o carta…" autocomplete="off"><select id="lf"><option value="">Todos</option><option value="Personaje">Personajes</option><option value="Estrategia">Estrategias</option><option value="Mío">Mis mazos</option></select></div>
  <div id="ll"></div>
</div>
<div id="libD" class="scr" hidden>
  <div class="bh"><button class="nb" id="ldBack">← Volver</button><b id="ldT"></b></div>
  <div id="ldI"></div>
  <div id="ldk" class="cg"></div>
  <div id="ldB" class="lbt"></div>
</div>
<aside id="logPanel" hidden><ol></ol></aside>
<div id="gyv" hidden></div>
<div id="zoom" hidden></div>
<div id="curtain" hidden></div>
<div id="adm" hidden>
  <div class="ah"><b>⚙ Panel</b><span class="sp"></span><button class="nb" id="aOff">Desactivar</button><button class="nb" id="aX">✕</button></div>
  <div id="asw"></div>
  <div class="bs"><input id="aq" type="search" placeholder="Buscar carta…" autocomplete="off"><select id="asrc"><option value="deck">Mi mazo</option><option value="all">Todas las cartas</option></select></div>
  <div id="agrid" class="cg"></div>
  <div id="aact" class="aact" hidden></div>
</div>
<div id="pad" hidden><div class="padbox"><h3>Acceso restringido</h3><div id="pd"></div><div class="pk"></div><button class="nb" id="padX">Cancelar</button></div></div>
<div id="rot"><p>📱↻<br>Girá el celular en vertical</p></div>
<script>
window.addEventListener('error',function(e){if(!e.message)return;var d=document.createElement('pre');d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:999;margin:0;padding:6px;background:#900;color:#fff;font:11px monospace;white-space:pre-wrap';d.textContent='ERROR: '+e.message+' ('+String(e.filename||'').split('/').pop()+':'+e.lineno+')';document.body.appendChild(d)},true);
window.addEventListener('load',function(){setTimeout(function(){if(!window.DUEL_OK){var d=document.createElement('pre');d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:999;margin:0;padding:6px;background:#900;color:#fff;font:11px monospace;white-space:pre-wrap';d.textContent='script.js no se cargó o se cortó antes de terminar';document.body.appendChild(d)}},300)});
</script>
<script src="script.js"></script>
<script async src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</body>
</html>
